name: AI PR Review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: KarloK34/pr-reviewer@pr-reviewer-v2
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          system-prompt-file: .github/pr-reviewer-prompt.md
