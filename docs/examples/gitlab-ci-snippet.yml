# Copy this job into your project's .gitlab-ci.yml.
# No changes to your existing `stages:` list are needed —
# stage: .pre is a GitLab built-in that always runs first.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   ANTHROPIC_API_KEY     — Anthropic API key (masked)
#   GITLAB_ACCESS_TOKEN   — Project access token with `api` scope (masked, non-protected
#                           so it works on feature branch MR pipelines)
#
# Also add to your repo:
#   .gitlab/pr-reviewer-prompt.md  — your project-specific Claude system prompt

ai-pr-review:
  image: node:24-alpine
  stage: .pre
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_STRATEGY: fetch
    SYSTEM_PROMPT_FILE: $CI_PROJECT_DIR/.gitlab/pr-reviewer-prompt.md
  cache:
    key: pr-reviewer-deps
    paths:
      - .reviewer/node_modules/
  before_script:
    - apk add --no-cache git
    - git clone --branch pr-reviewer-v2 https://github.com/KarloK34/pr-reviewer.git $CI_PROJECT_DIR/.reviewer
    - cd $CI_PROJECT_DIR/.reviewer && npm ci
  script:
    - cd $CI_PROJECT_DIR/.reviewer && npm run run:gitlab
